<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Cardo', Georgia, serif">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1B1A17" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- parchment ground -->
  <rect width="1200" height="800" fill="#F2EBDD"/>

  <!-- title block -->
  <g font-family="'Inter', system-ui, sans-serif" fill="#1B1A17">
    <text x="60" y="62" font-size="11" letter-spacing="2.2">THE CLOISTER · MARGAUX BOUDREAUX · 2026</text>
    <text x="60" y="84" font-family="'Cormorant Garamond', Georgia, serif" font-size="32" font-style="italic" font-weight="400">Typical Sleeping Floor — Plan</text>
    <text x="60" y="106" font-size="10" letter-spacing="1.6" fill="#8C8273">SCALE 1/8" = 1'-0"  ·  NORTH ↑  ·  DRAWING A-2.01</text>
  </g>

  <!-- legend -->
  <g font-family="'Inter', system-ui, sans-serif" fill="#3B362E" font-size="9" letter-spacing="0.5">
    <rect x="60" y="730" width="14" height="14" fill="url(#hatch)"/>
    <text x="82" y="741">12" LIMESTONE LOAD-BEARING WALL</text>
    <rect x="320" y="730" width="14" height="14" fill="#1B1A17"/>
    <text x="342" y="741">OAK FRAMING / DOORS</text>
    <rect x="540" y="730" width="14" height="14" fill="#E8DDC7" stroke="#1B1A17" stroke-width="0.8"/>
    <text x="562" y="741">PLASTERED PARTITION</text>
    <circle cx="780" cy="737" r="4" fill="#6B1F1A"/>
    <text x="794" y="741">EGRESS PATH</text>
  </g>

  <!-- north arrow -->
  <g transform="translate(1110,80)">
    <circle r="22" fill="none" stroke="#1B1A17" stroke-width="0.8"/>
    <polygon points="0,-18 6,8 0,2 -6,8" fill="#1B1A17"/>
    <text x="0" y="-26" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="10" letter-spacing="1.4" fill="#1B1A17">N</text>
  </g>

  <!-- compass labels north / south of building -->
  <text x="600" y="148" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" letter-spacing="2.2" fill="#8C8273">— COURT (north) —</text>
  <text x="600" y="694" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="11" letter-spacing="2.2" fill="#8C8273">— STREET (south) —</text>

  <!-- ====== BUILDING ENVELOPE: 12" walls drawn as outer + inner rect with hatch between ====== -->
  <path d="M 100 160 L 1100 160 L 1100 660 L 100 660 Z M 116 176 L 1084 176 L 1084 644 L 116 644 Z"
        fill="url(#hatch)" fill-rule="evenodd"/>
  <rect x="100" y="160" width="1000" height="500" fill="none" stroke="#1B1A17" stroke-width="1.4"/>
  <rect x="116" y="176" width="968" height="468" fill="none" stroke="#1B1A17" stroke-width="0.9"/>

  <!-- ====== CORRIDOR (central spine) ====== -->
  <rect x="116" y="380" width="968" height="60" fill="#F2EBDD" stroke="#8C8273" stroke-width="0.4" stroke-dasharray="2,3"/>
  <text x="600" y="425" text-anchor="middle" font-family="'Cardo', Georgia, serif" font-style="italic" font-size="14" fill="#8C8273">central corridor</text>

  <!-- ====== STAIR WEST (left) ====== -->
  <g>
    <rect x="140" y="200" width="120" height="160" fill="none" stroke="#1B1A17" stroke-width="1.2"/>
    <g stroke="#1B1A17" stroke-width="0.6">
      <line x1="148" y1="216" x2="252" y2="216"/>
      <line x1="148" y1="232" x2="252" y2="232"/>
      <line x1="148" y1="248" x2="252" y2="248"/>
      <line x1="148" y1="264" x2="252" y2="264"/>
      <line x1="148" y1="280" x2="252" y2="280"/>
      <line x1="148" y1="296" x2="252" y2="296"/>
      <line x1="148" y1="312" x2="252" y2="312"/>
      <line x1="148" y1="328" x2="252" y2="328"/>
      <line x1="148" y1="344" x2="252" y2="344"/>
    </g>
    <line x1="200" y1="350" x2="200" y2="210" stroke="#6B1F1A" stroke-width="1.4"/>
    <polygon points="195,215 200,205 205,215" fill="#6B1F1A"/>
    <text x="200" y="372" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" letter-spacing="1.4" fill="#1B1A17">STAIR · UP</text>
  </g>

  <!-- ====== STAIR EAST (right) ====== -->
  <g>
    <rect x="940" y="200" width="120" height="160" fill="none" stroke="#1B1A17" stroke-width="1.2"/>
    <g stroke="#1B1A17" stroke-width="0.6">
      <line x1="948" y1="216" x2="1052" y2="216"/>
      <line x1="948" y1="232" x2="1052" y2="232"/>
      <line x1="948" y1="248" x2="1052" y2="248"/>
      <line x1="948" y1="264" x2="1052" y2="264"/>
      <line x1="948" y1="280" x2="1052" y2="280"/>
      <line x1="948" y1="296" x2="1052" y2="296"/>
      <line x1="948" y1="312" x2="1052" y2="312"/>
      <line x1="948" y1="328" x2="1052" y2="328"/>
      <line x1="948" y1="344" x2="1052" y2="344"/>
    </g>
    <line x1="1000" y1="350" x2="1000" y2="210" stroke="#6B1F1A" stroke-width="1.4"/>
    <polygon points="995,215 1000,205 1005,215" fill="#6B1F1A"/>
    <text x="1000" y="372" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" letter-spacing="1.4" fill="#1B1A17">STAIR · UP</text>
  </g>

  <!-- ====== LIFT (west of center) and BATH SPINE ====== -->
  <!-- lift just east of west stair -->
  <g>
    <rect x="280" y="200" width="60" height="60" fill="none" stroke="#1B1A17" stroke-width="1.2"/>
    <line x1="280" y1="200" x2="340" y2="260" stroke="#1B1A17" stroke-width="0.4"/>
    <line x1="340" y1="200" x2="280" y2="260" stroke="#1B1A17" stroke-width="0.4"/>
    <text x="310" y="280" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="9" letter-spacing="1.4" fill="#1B1A17">LIFT</text>
  </g>

  <!-- bath spine: in NORTH half of building, occupying middle 6 modules -->
  <g>
    <rect x="360" y="200" width="480" height="160" fill="#E8DDC7" stroke="#1B1A17" stroke-width="1.2"/>
    <!-- 6 stalls -->
    <g stroke="#8C8273" stroke-width="0.6">
      <line x1="440" y1="200" x2="440" y2="280"/>
      <line x1="520" y1="200" x2="520" y2="280"/>
      <line x1="600" y1="200" x2="600" y2="280"/>
      <line x1="680" y1="200" x2="680" y2="280"/>
      <line x1="760" y1="200" x2="760" y2="280"/>
    </g>
    <!-- 6 little circles for shower drains -->
    <g fill="#1B1A17">
      <circle cx="400" cy="240" r="3"/>
      <circle cx="480" cy="240" r="3"/>
      <circle cx="560" cy="240" r="3"/>
      <circle cx="640" cy="240" r="3"/>
      <circle cx="720" cy="240" r="3"/>
      <circle cx="800" cy="240" r="3"/>
    </g>
    <!-- long stone trough sink -->
    <rect x="400" y="295" width="400" height="20" fill="none" stroke="#1B1A17" stroke-width="0.8"/>
    <g fill="#A87A2C">
      <circle cx="430" cy="305" r="2.5"/>
      <circle cx="490" cy="305" r="2.5"/>
      <circle cx="550" cy="305" r="2.5"/>
      <circle cx="610" cy="305" r="2.5"/>
      <circle cx="670" cy="305" r="2.5"/>
      <circle cx="730" cy="305" r="2.5"/>
    </g>

    <!-- bath spine label sits clearly above the rect, in the unused area between rect and corridor -->
    <text x="600" y="372" text-anchor="middle" font-family="'Cardo', Georgia, serif" font-style="italic" font-size="13" fill="#1B1A17">bath spine</text>
  </g>

  <text x="600" y="190" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">6 SHOWER STALLS · STONE TROUGH · BRASS TAPS</text>

  <!-- linen / utility (east of east stair, in north area) -->
  <g>
    <rect x="860" y="200" width="80" height="60" fill="#E8DDC7" stroke="#1B1A17" stroke-width="0.8"/>
    <text x="900" y="240" text-anchor="middle" font-family="'Cardo', Georgia, serif" font-style="italic" font-size="11" fill="#1B1A17">linen</text>
  </g>

  <!-- ====== SOUTH SIDE: 6 CELLS along the street (y 460-644) ====== -->
  <g>
    <g stroke="#1B1A17" stroke-width="1" fill="#F2EBDD">
      <rect x="280" y="460" width="100" height="184"/>
      <rect x="380" y="460" width="100" height="184"/>
      <rect x="480" y="460" width="100" height="184"/>
      <rect x="580" y="460" width="100" height="184"/>
      <rect x="680" y="460" width="100" height="184"/>
      <rect x="780" y="460" width="100" height="184"/>
    </g>

    <!-- bed icon in each cell -->
    <g stroke="#1B1A17" stroke-width="0.6" fill="#E8DDC7">
      <rect x="295" y="475" width="32" height="68"/>
      <rect x="395" y="475" width="32" height="68"/>
      <rect x="495" y="475" width="32" height="68"/>
      <rect x="595" y="475" width="32" height="68"/>
      <rect x="695" y="475" width="32" height="68"/>
      <rect x="795" y="475" width="32" height="68"/>
    </g>

    <!-- small desk -->
    <g stroke="#1B1A17" stroke-width="0.5" fill="none">
      <rect x="345" y="595" width="28" height="14"/>
      <rect x="445" y="595" width="28" height="14"/>
      <rect x="545" y="595" width="28" height="14"/>
      <rect x="645" y="595" width="28" height="14"/>
      <rect x="745" y="595" width="28" height="14"/>
      <rect x="845" y="595" width="28" height="14"/>
    </g>

    <!-- doors (swing arcs into corridor) -->
    <g stroke="#1B1A17" stroke-width="0.5" fill="none">
      <path d="M 300 460 Q 318 460 318 442"/>
      <path d="M 400 460 Q 418 460 418 442"/>
      <path d="M 500 460 Q 518 460 518 442"/>
      <path d="M 600 460 Q 618 460 618 442"/>
      <path d="M 700 460 Q 718 460 718 442"/>
      <path d="M 800 460 Q 818 460 818 442"/>
    </g>

    <!-- labels -->
    <g font-family="'Cardo', Georgia, serif" font-style="italic" font-size="11" fill="#1B1A17" text-anchor="middle">
      <text x="350" y="630">cell I</text>
      <text x="450" y="630">cell II</text>
      <text x="550" y="630">cell III</text>
      <text x="650" y="630">cell IV</text>
      <text x="750" y="630">cell V</text>
      <text x="850" y="630">cell VI</text>
    </g>

    <!-- cell sqft note -->
    <text x="580" y="676" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">six cells · 95 sq ft each · single bed · 1 window each</text>
  </g>

  <!-- ====== SOUTH WINDOWS (street wall) on cells ====== -->
  <g stroke="#1B1A17" stroke-width="3">
    <line x1="320" y1="660" x2="350" y2="660"/>
    <line x1="420" y1="660" x2="450" y2="660"/>
    <line x1="520" y1="660" x2="550" y2="660"/>
    <line x1="620" y1="660" x2="650" y2="660"/>
    <line x1="720" y1="660" x2="750" y2="660"/>
    <line x1="820" y1="660" x2="850" y2="660"/>
  </g>

  <!-- ====== NORTH WINDOWS (court wall) on bath spine ====== -->
  <g stroke="#1B1A17" stroke-width="3">
    <line x1="380" y1="160" x2="420" y2="160"/>
    <line x1="460" y1="160" x2="500" y2="160"/>
    <line x1="540" y1="160" x2="580" y2="160"/>
    <line x1="620" y1="160" x2="660" y2="160"/>
    <line x1="700" y1="160" x2="740" y2="160"/>
    <line x1="780" y1="160" x2="820" y2="160"/>
  </g>

  <!-- egress path indicators (placed at corridor edges, not centered on text) -->
  <g fill="#6B1F1A">
    <circle cx="200" cy="395" r="3.5"/>
    <circle cx="1000" cy="395" r="3.5"/>
  </g>

  <!-- dimension lines (overall) -->
  <g stroke="#8C8273" stroke-width="0.4" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">
    <line x1="100" y1="700" x2="1100" y2="700"/>
    <line x1="100" y1="697" x2="100" y2="703"/>
    <line x1="1100" y1="697" x2="1100" y2="703"/>
    <text x="600" y="714" text-anchor="middle">100' — 0"</text>
    <line x1="60" y1="160" x2="60" y2="660"/>
    <line x1="57" y1="160" x2="63" y2="160"/>
    <line x1="57" y1="660" x2="63" y2="660"/>
    <text x="48" y="412" text-anchor="middle" transform="rotate(-90,48,412)">50' — 0"</text>
  </g>

  <!-- floor caption (top of plan area) -->
  <text x="600" y="135" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">SLEEPING FLOORS 2 + 3 (CELLS) · BUNK DORMITORIES ON FLOORS 4 + 5 (NOT SHOWN)</text>
</svg>
