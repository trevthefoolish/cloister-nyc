<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="'Cardo', Georgia, serif">
  <defs>
    <pattern id="stoneHatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1B1A17" stroke-width="0.6"/>
    </pattern>
    <pattern id="earth" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(0)">
      <line x1="0" y1="6" x2="8" y2="6" stroke="#8C8273" stroke-width="0.5"/>
      <line x1="2" y1="2" x2="2" y2="3" stroke="#8C8273" stroke-width="0.6"/>
      <line x1="5" y1="4" x2="5" y2="5" stroke="#8C8273" stroke-width="0.6"/>
    </pattern>
    <pattern id="timber" patternUnits="userSpaceOnUse" width="14" height="6">
      <line x1="0" y1="3" x2="14" y2="3" stroke="#3B362E" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="1200" height="800" fill="#F2EBDD"/>

  <!-- title block -->
  <g font-family="'Inter', system-ui, sans-serif" fill="#1B1A17">
    <text x="60" y="62" font-size="11" letter-spacing="2.2">THE CLOISTER · MARGAUX BOUDREAUX · 2026</text>
    <text x="60" y="84" font-family="'Cormorant Garamond', Georgia, serif" font-size="32" font-style="italic">Long Building Section</text>
    <text x="60" y="106" font-size="10" letter-spacing="1.6" fill="#8C8273">SCALE 1/8" = 1'-0"  ·  LOOKING WEST  ·  DRAWING A-3.01</text>
  </g>

  <!-- sky tint at top -->
  <rect x="0" y="120" width="1200" height="40" fill="#E8DDC7" opacity="0.4"/>

  <!-- street -->
  <text x="180" y="640" font-family="'Inter', system-ui, sans-serif" font-size="10" letter-spacing="2" fill="#8C8273">— STREET / SOUTH ELEVATION —</text>
  <text x="940" y="640" font-family="'Inter', system-ui, sans-serif" font-size="10" letter-spacing="2" fill="#8C8273">— REAR COURT / NORTH —</text>

  <!-- earth -->
  <rect x="100" y="620" width="1000" height="100" fill="url(#earth)"/>

  <!-- ============== FOUNDATION + REFECTORY (below grade) ============== -->
  <!-- spread footings -->
  <rect x="120" y="600" width="20" height="20" fill="url(#stoneHatch)"/>
  <rect x="1060" y="600" width="20" height="20" fill="url(#stoneHatch)"/>

  <!-- refectory below grade: from y=520 (floor below grade) to 620 -->
  <rect x="140" y="510" width="920" height="110" fill="#F2EBDD" stroke="#1B1A17" stroke-width="2"/>
  <text x="600" y="572" text-anchor="middle" font-family="'Cardo', Georgia, serif" font-style="italic" font-size="20" fill="#1B1A17">refectory</text>
  <text x="600" y="592" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">12'-0" CLR · 950 sq ft · clerestory above</text>
  <!-- one long table icon (moved below the label so they don't overlap) -->
  <rect x="380" y="606" width="440" height="8" fill="#3B362E"/>

  <!-- clerestory at street level above refectory -->
  <line x1="200" y1="510" x2="240" y2="510" stroke="#1B1A17" stroke-width="3"/>
  <line x1="280" y1="510" x2="320" y2="510" stroke="#1B1A17" stroke-width="3"/>
  <line x1="360" y1="510" x2="400" y2="510" stroke="#1B1A17" stroke-width="3"/>

  <!-- ground floor : Common House (lobby) ============== -->
  <!-- 15ft vault: from y=380 to y=510 -->
  <rect x="120" y="380" width="960" height="130" fill="#F2EBDD" stroke="#1B1A17" stroke-width="2"/>
  <!-- vault arch (dotted line for ceiling profile) -->
  <path d="M 140 510 Q 600 360 1060 510" fill="none" stroke="#8C8273" stroke-width="0.8" stroke-dasharray="4,3"/>

  <text x="600" y="450" text-anchor="middle" font-family="'Cardo', Georgia, serif" font-style="italic" font-size="22" fill="#1B1A17">the common house</text>
  <text x="600" y="472" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">15'-0" VAULT · 1,400 sq ft</text>
  <text x="600" y="486" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">bar · stove · piano · library</text>

  <!-- doors at street -->
  <rect x="200" y="470" width="22" height="40" fill="none" stroke="#1B1A17" stroke-width="1.2"/>
  <rect x="222" y="470" width="22" height="40" fill="none" stroke="#1B1A17" stroke-width="1.2"/>
  <text x="232" y="528" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="8" fill="#8C8273">ENTRY</text>

  <!-- arched windows -->
  <g fill="none" stroke="#1B1A17" stroke-width="1">
    <path d="M 300 510 L 300 425 Q 320 405 340 425 L 340 510"/>
    <path d="M 380 510 L 380 425 Q 400 405 420 425 L 420 510"/>
    <path d="M 880 510 L 880 425 Q 900 405 920 425 L 920 510"/>
    <path d="M 800 510 L 800 425 Q 820 405 840 425 L 840 510"/>
  </g>

  <!-- ============== SLEEPING FLOORS x4 (each 9ft) ============== -->
  <!-- Floor 2: y 320-380 -->
  <!-- Floor 3: y 260-320 -->
  <!-- Floor 4: y 200-260 -->
  <!-- Floor 5: y 140-200 -->
  <g stroke="#1B1A17" stroke-width="2" fill="none">
    <rect x="120" y="140" width="960" height="240"/>
  </g>

  <!-- floor lines (mass timber slabs) -->
  <g>
    <rect x="120" y="200" width="960" height="6" fill="url(#timber)"/>
    <rect x="120" y="260" width="960" height="6" fill="url(#timber)"/>
    <rect x="120" y="320" width="960" height="6" fill="url(#timber)"/>
    <rect x="120" y="380" width="960" height="6" fill="#3B362E"/> <!-- main floor over lobby -->
  </g>

  <!-- room divisions per floor -->
  <g stroke="#8C8273" stroke-width="0.5">
    <!-- floor 2 -->
    <line x1="220" y1="326" x2="220" y2="380"/>
    <line x1="320" y1="326" x2="320" y2="380"/>
    <line x1="420" y1="326" x2="420" y2="380"/>
    <line x1="520" y1="326" x2="520" y2="380"/>
    <line x1="620" y1="326" x2="620" y2="380"/>
    <line x1="720" y1="326" x2="720" y2="380"/>
    <line x1="820" y1="326" x2="820" y2="380"/>
    <line x1="920" y1="326" x2="920" y2="380"/>
    <line x1="1020" y1="326" x2="1020" y2="380"/>

    <line x1="220" y1="266" x2="220" y2="320"/>
    <line x1="320" y1="266" x2="320" y2="320"/>
    <line x1="420" y1="266" x2="420" y2="320"/>
    <line x1="520" y1="266" x2="520" y2="320"/>
    <line x1="620" y1="266" x2="620" y2="320"/>
    <line x1="720" y1="266" x2="720" y2="320"/>
    <line x1="820" y1="266" x2="820" y2="320"/>
    <line x1="920" y1="266" x2="920" y2="320"/>
    <line x1="1020" y1="266" x2="1020" y2="320"/>

    <line x1="220" y1="206" x2="220" y2="260"/>
    <line x1="420" y1="206" x2="420" y2="260"/>
    <line x1="620" y1="206" x2="620" y2="260"/>
    <line x1="820" y1="206" x2="820" y2="260"/>
    <line x1="1020" y1="206" x2="1020" y2="260"/>

    <line x1="220" y1="146" x2="220" y2="200"/>
    <line x1="420" y1="146" x2="420" y2="200"/>
    <line x1="620" y1="146" x2="620" y2="200"/>
    <line x1="820" y1="146" x2="820" y2="200"/>
    <line x1="1020" y1="146" x2="1020" y2="200"/>
  </g>

  <!-- bed icons in cells (small) -->
  <g fill="#E8DDC7" stroke="#1B1A17" stroke-width="0.4">
    <!-- floor 2: 8 cells -->
    <g><rect x="335" y="350" width="30" height="20"/><rect x="435" y="350" width="30" height="20"/><rect x="535" y="350" width="30" height="20"/><rect x="635" y="350" width="30" height="20"/><rect x="735" y="350" width="30" height="20"/><rect x="835" y="350" width="30" height="20"/><rect x="935" y="350" width="30" height="20"/></g>
    <!-- floor 3 -->
    <g><rect x="335" y="290" width="30" height="20"/><rect x="435" y="290" width="30" height="20"/><rect x="535" y="290" width="30" height="20"/><rect x="635" y="290" width="30" height="20"/><rect x="735" y="290" width="30" height="20"/><rect x="835" y="290" width="30" height="20"/><rect x="935" y="290" width="30" height="20"/></g>
  </g>

  <!-- bunk row icons in dormitory section -->
  <g fill="#E8DDC7" stroke="#1B1A17" stroke-width="0.4">
    <g><rect x="240" y="216" width="40" height="14"/><rect x="290" y="216" width="40" height="14"/><rect x="340" y="216" width="40" height="14"/><rect x="390" y="216" width="40" height="14"/></g>
    <g><rect x="640" y="216" width="40" height="14"/><rect x="690" y="216" width="40" height="14"/><rect x="740" y="216" width="40" height="14"/><rect x="790" y="216" width="40" height="14"/></g>
    <g><rect x="240" y="156" width="40" height="14"/><rect x="290" y="156" width="40" height="14"/><rect x="340" y="156" width="40" height="14"/><rect x="390" y="156" width="40" height="14"/></g>
    <g><rect x="640" y="156" width="40" height="14"/><rect x="690" y="156" width="40" height="14"/><rect x="740" y="156" width="40" height="14"/><rect x="790" y="156" width="40" height="14"/></g>
  </g>

  <!-- floor labels -->
  <g font-family="'Cardo', Georgia, serif" font-style="italic" font-size="13" fill="#1B1A17" text-anchor="middle">
    <text x="600" y="370">floor 2 — six cells + central bath</text>
    <text x="600" y="310">floor 3 — six cells + central bath</text>
    <text x="600" y="250">floor 4 — two bunk dormitories</text>
    <text x="600" y="190">floor 5 — two bunk dormitories + suites</text>
  </g>

  <!-- masonry walls hatch -->
  <rect x="100" y="120" width="20" height="500" fill="url(#stoneHatch)"/>
  <rect x="1080" y="120" width="20" height="500" fill="url(#stoneHatch)"/>

  <!-- roof: Vermont slate, simple gable -->
  <polygon points="100,140 600,90 1100,140" fill="none" stroke="#1B1A17" stroke-width="2"/>
  <polygon points="120,140 600,108 1080,140" fill="#E8DDC7" stroke="#1B1A17" stroke-width="0.6"/>
  <text x="600" y="124" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">VERMONT SLATE · COPPER FLASHING · 8:12 PITCH</text>

  <!-- floor markers / dimension stack -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="9" fill="#8C8273">
    <text x="1110" y="143">+62'</text>
    <text x="1110" y="203">+53'</text>
    <text x="1110" y="263">+44'</text>
    <text x="1110" y="323">+35'</text>
    <text x="1110" y="383">+26'</text>
    <text x="1110" y="513">+11'</text>
    <text x="1110" y="623">±0' (street)</text>
    <text x="1110" y="713">−12' (refectory)</text>
  </g>

  <!-- room labels for clarity -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="9" letter-spacing="1.2" fill="#8C8273">
    <text x="160" y="175">stair</text>
    <text x="160" y="235">stair</text>
    <text x="160" y="295">stair</text>
    <text x="160" y="355">stair</text>
    <text x="160" y="475">lobby</text>
  </g>

  <!-- chapel call-out (top floor west) -->
  <rect x="222" y="146" width="92" height="54" fill="#3F4A36" opacity="0.12"/>
  <text x="268" y="178" text-anchor="middle" font-family="'Cardo', Georgia, serif" font-style="italic" font-size="11" fill="#3F4A36">the quiet room</text>

  <!-- skylight oculus over chapel -->
  <circle cx="268" cy="138" r="5" fill="#F2EBDD" stroke="#1B1A17" stroke-width="0.8"/>
  <line x1="268" y1="138" x2="268" y2="146" stroke="#8C8273" stroke-width="0.4" stroke-dasharray="2,2"/>

  <!-- key/legend -->
  <g font-family="'Inter', system-ui, sans-serif" font-size="9" fill="#3B362E" letter-spacing="0.6">
    <rect x="60" y="745" width="14" height="6" fill="url(#timber)"/>
    <text x="82" y="752">CLT MASS-TIMBER FLOOR DECK (5-ply spruce, exposed soffit)</text>
    <rect x="380" y="745" width="14" height="14" fill="url(#stoneHatch)"/>
    <text x="402" y="755">12" QUARRIED LIMESTONE LOAD-BEARING WALL</text>
    <rect x="700" y="745" width="14" height="14" fill="url(#earth)"/>
    <text x="722" y="755">EARTH / SPREAD FOOTING</text>
  </g>
</svg>
